[package]
name = "kettler"
version = "1.5.10"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-serial = "5.5.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Chest straps over BlueZ (D-Bus); needs libdbus-1-dev to build, libdbus-1-3 to run.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
http-body-util = "0.1"
futures-util = "0.3"
